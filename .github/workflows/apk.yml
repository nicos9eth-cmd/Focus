name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test
        run: gradle test --no-daemon
        working-directory: android
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android
      - name: Stable filename
        working-directory: android
        run: |
          src=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$src"
          cp "$src" "$GITHUB_WORKSPACE/Focus.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Focus-debug
          path: Focus.apk
          if-no-files-found: error
      - name: Publish sideload release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sideload --yes --cleanup-tag || true
          gh release create sideload "$GITHUB_WORKSPACE/Focus.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Focus — APK sideload" \
            --notes "Build debug pour installation manuelle. Ce n'est pas une build Play Store. Active le service d'accessibilité Focus au premier lancement."
